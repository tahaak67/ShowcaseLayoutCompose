schema_version: "1.1"
name: locked-step-old-version
expected_outcome: |
  The project is on showcase-layout-compose 1.1.1, which has no locked steps or custom composable
  messages. The agent notices and bumps the version (to 1.2.0 or 1.3.0) and tells the developer. If it
  goes to 1.3.0 it also migrates WelcomeScreen's Arrow(headSize = 30f) to a Dp. The username step uses
  Modifier.showcase(canProceed = <username typed>) so the field stays usable during the step and the
  tour moves on by itself; onProceed clears focus/hides the keyboard. The cards are ShowcaseMsg { }
  composables with a Skip button calling skip(), and the locked card has no Next that bypasses the
  lock. The layout sits in a parent that stacks children (not directly in the Column). Everything
  compiles against the version declared in libs.versions.toml.
context:
  scaffold_script: place-files.sh
